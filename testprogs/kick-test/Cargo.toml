[package]
name = "kick-test"
version = "0.1.0"
edition = "2021"
autobins = false

[lib]
name = "kick_test"
crate-type = ["staticlib"]
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true

[dependencies]
amigaos4 = { path = "../..", default-features = false }
