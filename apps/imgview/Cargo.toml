[package]
name = "imgview"
version = "0.1.0"
edition = "2021"
autobins = false

[lib]
name = "imgview"
crate-type = ["staticlib"]
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true

[dependencies]
amigaos4 = { path = "../..", default-features = false, features = ["dos", "graphics", "intuition", "reaction", "workbench", "datatypes", "application", "prefs_objects", "asl", "icon"] }
